name: Caribou Biosciences

description: 'Caribou Biosciences is a clinical-stage biopharmaceutical company focused on developing transformative genome‑edited allogeneic cell therapies. Leveraging its proprietary CRISPR hybrid RNA‑DNA (chRDNA) technology, Caribou creates off‑the‑shelf CAR‑T cell therapies aimed at treating devastating diseases such as cancers and genetic disorders. The company emphasizes precision genome editing, armored cell therapies, and rapid patient access, positioning itself as a leader in the CRISPR field.'

